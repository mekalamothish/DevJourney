<div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
  <label class="sr-only" for="blog-search">Search articles</label>
  <div class="mt-4">
    <div class="relative">
      <div class="pointer-events-none absolute inset-y-0 left-4 flex items-center text-gray-400 dark:text-gray-500">
        <svg class="w-4.5 h-4.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z" />
        </svg>
      </div>
      <input
        id="blog-search"
        type="search"
        [value]="value"
        (input)="onInput($event)"
        placeholder="Search articles by title, excerpt, category, or tag"
        class="w-full rounded-xl border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-900 pl-11 pr-4 py-3 text-sm text-gray-900 dark:text-white placeholder:text-gray-400 dark:placeholder:text-gray-500 shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500 transition-shadow"
      />
       <button
            type="button"
            (click)="clear()"
            class="absolute inset-y-0 right-3 flex items-center text-gray-400 hover:text-gray-600 dark:hover:text-gray-300 transition-colors"
            aria-label="Clear search"
          >
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      
    </div>
  </div>
</div>
