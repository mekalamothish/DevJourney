<section class="mt-8">
  <div *ngFor="let b of blocks">
    <ng-container [ngSwitch]="b.type">

      <p *ngSwitchCase="'paragraph'" class="mt-4 text-ink/90">{{ $any(b).text }}</p>

      <h2 *ngSwitchCase="'heading'" [id]="$any(b).id" class="mt-8 scroll-mt-28 text-2xl font-semibold text-ink">{{ $any(b).text }}</h2>

      <h3 *ngSwitchCase="'subheading'" [id]="$any(b).id" class="mt-6 text-lg font-semibold text-ink">{{ $any(b).text }}</h3>

      <ul *ngSwitchCase="'list'" class="ml-6 mt-4 list-disc text-ink/90">
        <li *ngFor="let li of $any(b).items">{{ li }}</li>
      </ul>

      <dj-code-block *ngSwitchCase="'code'" [code]="$any(b).code" [language]="$any(b).language"></dj-code-block>

      <div *ngSwitchCase="'terminal'" class="my-6 rounded-md border bg-black/90 text-white">
        <div class="px-3 py-2 text-xs text-white/70">Terminal</div>
        <pre class="overflow-auto p-4 text-sm font-mono"><code>{{ $any(b).commands }}</code></pre>
      </div>

      <blockquote *ngSwitchCase="'quote'" class="mt-6 border-l-2 pl-4 italic text-ink/80">{{ $any(b).text }}</blockquote>

      <div *ngSwitchCase="'callout'" class="my-6 rounded-md border-l-4 px-4 py-3" [ngClass]="{
        'border-blue-400 bg-blue-50': $any(b).variant === 'note',
        'border-green-400 bg-green-50': $any(b).variant === 'tip',
        'border-yellow-400 bg-yellow-50': $any(b).variant === 'warning',
        'border-red-400 bg-red-50': $any(b).variant === 'important'
      }">
        <div class="font-semibold text-ink">{{ $any(b).heading || $any(b).title }}</div>
        <div class="mt-2 text-ink/90">{{ $any(b).text }}</div>
      </div>

      <div *ngSwitchCase="'table'" class="my-6 overflow-auto">
        <table class="w-full table-auto text-left">
          <thead>
            <tr>
              <th *ngFor="let h of $any(b).headers" class="px-2 py-1 text-sm font-semibold text-ink">{{ h }}</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let row of $any(b).rows">
              <td *ngFor="let cell of row" class="px-2 py-1 text-ink/90">{{ cell }}</td>
            </tr>
          </tbody>
        </table>
      </div>

      <div *ngSwitchCase="'image'" class="my-6">
        <img [src]="$any(b).src" [alt]="$any(b).alt || ''" class="w-full rounded-md object-cover" />
        <div *ngIf="$any(b).caption" class="mt-2 text-sm text-ink/60">{{ $any(b).caption }}</div>
      </div>

      <div *ngSwitchCase="'takeaways'" class="my-6 rounded-md border bg-canvas p-4">
        <div class="font-semibold text-ink">Key Takeaways</div>
        <ul class="mt-3 ml-4 list-outside list-disc text-ink/90">
          <li *ngFor="let t of $any(b).items">{{ t }}</li>
        </ul>
      </div>

      <dj-article-faq *ngSwitchCase="'faq'" [items]="$any(b).items"></dj-article-faq>

    </ng-container>
  </div>
</section>
