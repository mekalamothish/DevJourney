<nav aria-label="On this page" class="sticky top-28">
  <div class="block lg:hidden">
    <button class="w-full rounded-md border px-3 py-2 text-left" (click)="collapsed = !collapsed">
      Table of Contents
      <span class="float-right">▼</span>
    </button>
    <div *ngIf="!collapsed" class="mt-2 rounded-md border bg-canvas p-3">
      <ol class="space-y-2">
        <li *ngFor="let h of headings; let i = index">
          <button class="w-full text-left text-sm text-ink/90" (click)="goTo(h.id)">
            <span class="text-ink/60">{{ (i+1) | number:'2.0' }} </span> {{ h.text }}
          </button>
        </li>
      </ol>
    </div>
  </div>

  <div class="hidden lg:block">
    <div class="rounded-md border bg-canvas border-gray-500/50p-4">
      <div class="text-sm font-semibold text-ink">On this page</div>
      <ol class="mt-3 space-y-2 text-sm">
        <li *ngFor="let h of headings; let i = index">
          <button class="w-full text-left text-ink/90" (click)="goTo(h.id)">
            <span class="mr-2 text-ink/60">{{ (i+1) | number:'2.0' }}</span>
            {{ h.text }}
          </button>
        </li>
      </ol>
    </div>
  </div>
</nav>
