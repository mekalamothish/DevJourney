<nav aria-label="On this page" class="sticky top-28">
  <!-- Mobile: collapsible -->
  <div class="block lg:hidden">
    <button 
      class="w-full flex items-center justify-between rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-900 px-3.5 py-2.5 text-left text-sm font-medium text-gray-900 dark:text-white shadow-sm"
      (click)="collapsed = !collapsed"
      type="button"
    >
      <span class="inline-flex items-center gap-2">
        <svg class="w-4 h-4 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" />
        </svg>
        Table of Contents
      </span>
      <svg 
        class="w-4 h-4 text-gray-400 transition-transform" 
        [class.rotate-180]="!collapsed"
        fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"
      >
        <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 8.25l-7.5 7.5-7.5-7.5" />
      </svg>
    </button>
    @if (!collapsed) {
      <div class="mt-2 rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-900 shadow-sm p-3">
        <ol class="space-y-0.5">
          @for (h of headings; track h.id; let i = $index) {
            <li>
              <button 
                class="w-full flex items-start gap-2 rounded-md px-2 py-1.5 text-left text-sm text-gray-700 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-gray-800 hover:text-gray-900 dark:hover:text-white transition-colors"
                (click)="goTo(h.id)"
                type="button"
              >
                <span class="text-gray-400 dark:text-gray-500 tabular-nums shrink-0">{{ (i+1) | number:'2.0' }}</span>
                <span>{{ h.text }}</span>
              </button>
            </li>
          }
        </ol>
      </div>
    }
  </div>

  <!-- Desktop: always visible -->
  <div class="hidden lg:block">
    <div class="rounded-xl border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-900 shadow-sm p-4 max-h-[calc(100vh-8rem)] overflow-y-auto">
      <div class="flex items-center gap-2 text-sm font-semibold text-gray-900 dark:text-white">
        <svg class="w-4 h-4 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" />
        </svg>
        On this page
      </div>
      <ol class="mt-3 space-y-0.5 text-sm">
        @for (h of headings; track h.id; let i = $index) {
          <li>
            <button 
              class="w-full flex items-start gap-2 rounded-md px-2 py-1.5 text-left text-gray-600 dark:text-gray-400 hover:bg-gray-50 dark:hover:bg-gray-800 hover:text-gray-900 dark:hover:text-white transition-colors"
              (click)="goTo(h.id)"
              type="button"
            >
              <span class="text-gray-400 dark:text-gray-500 tabular-nums shrink-0">{{ (i+1) | number:'2.0' }}</span>
              <span class="leading-snug">{{ h.text }}</span>
            </button>
          </li>
        }
      </ol>
    </div>
  </div>
</nav>
