<div [class.flex]="inline" class="items-center gap-3">
  <div class="relative h-10 w-10 shrink-0 rounded-full ring-2 ring-white dark:ring-gray-900 shadow-sm overflow-hidden">
    @if (author.avatar) {
      <img [src]="author.avatar" [alt]="author.name" class="h-10 w-10 object-cover" />
    } @else {
      <div class="h-10 w-10 flex items-center justify-center bg-gradient-to-br from-blue-500 to-indigo-600 text-white text-sm font-semibold">
        {{ author.name.charAt(0).toUpperCase() || '👨‍💻' }}
      </div>
    }
  </div>
  <div class="min-w-0">
    <div class="text-sm font-semibold text-gray-900 dark:text-white truncate">{{ author.name }}</div>
    <div class="text-xs text-gray-500 dark:text-gray-400 truncate">{{ author.role || 'Author' }}</div>
  </div>
</div>
