<div [class.flex]="inline" class="items-center gap-3">
  <div class="h-10 w-10 overflow-hidden rounded-full bg-canvas/50 flex items-center justify-center text-ink">
    <span *ngIf="!author.avatar">👨‍💻</span>
    <img *ngIf="author.avatar" [src]="author.avatar" [alt]="author.name" class="h-10 w-10 object-cover" />
  </div>
  <div>
    <div class="text-sm font-semibold text-ink">{{ author.name }}</div>
    <div class="text-xs text-ink/60">{{ author.role || 'Author' }}</div>
  </div>
</div>
