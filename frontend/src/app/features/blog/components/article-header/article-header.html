<header class="mt-4">
  <div class="flex flex-wrap items-center gap-2">
    <span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-medium bg-blue-50 dark:bg-blue-900/30 text-blue-700 dark:text-blue-300">
      {{ post.category.name }}
    </span>
    <span class="inline-flex items-center gap-1 text-xs text-gray-500 dark:text-gray-400">
      <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
      {{ post.readingTime }} min read
    </span>
    <span class="text-xs text-gray-300 dark:text-gray-600">•</span>
    <time class="text-xs text-gray-500 dark:text-gray-400">{{ post.publishedAt }}</time>
  </div>

  <h1 class="mt-4 font-display text-3xl font-bold leading-tight tracking-tight text-gray-900 dark:text-white sm:text-4xl lg:text-5xl">
    {{ post.title }}
  </h1>
  <p class="mt-4 text-lg leading-relaxed text-gray-600 dark:text-gray-300">{{ post.excerpt }}</p>

  <div class="mt-6 pb-6 border-b border-gray-200 dark:border-gray-800">
    <dj-article-author [author]="post.author" [inline]="true" />
  </div>
</header>
