<header class="mt-4">
  <div class="flex items-center gap-3">
    <span class="badge">{{ post.category.name }}</span>
    <span class="text-xs text-ink/60">• {{ post.readingTime }} min</span>
    <span class="text-xs text-ink/60">•</span>
    <time class="text-xs text-ink/60">{{ post.publishedAt }}</time>
  </div>

  <h1 class="mt-3 font-display text-3xl font-semibold leading-tight text-ink sm:text-4xl lg:text-5xl">{{ post.title }}</h1>
  <p class="mt-3 text-lg text-ink/70">{{ post.excerpt }}</p>

  <div class="mt-4">
    <dj-article-author [author]="post.author" [inline]="true" />
  </div>
</header>
