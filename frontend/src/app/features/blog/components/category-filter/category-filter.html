<div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
  <div class="mt-4 flex flex-wrap items-center gap-2">
    <button 
      (click)="select(undefined)" 
      [attr.aria-pressed]="!selected" 
      type="button"
      class="px-3 py-1.5 text-sm font-medium rounded-full transition-colors"
      [class.bg-gray-900]="!selected"
      [class.text-white]="!selected"
      [class.dark:bg-white]="!selected"
      [class.dark:text-gray-900]="!selected"
      [class.text-gray-600]="selected"
      [class.dark:text-gray-400]="selected"
      [class.bg-gray-100]="selected"
      [class.dark:bg-gray-800]="selected"
      [class.hover:bg-gray-200]="selected"
      [class.dark:hover:bg-gray-700]="selected"
    >
      All
    </button>
    @for (cat of categories; track cat) {
      <button
        (click)="select(cat)"
        [attr.aria-pressed]="selected === cat"
        type="button"
        class="px-3 py-1.5 text-sm font-medium rounded-full transition-colors"
        [class.bg-blue-600]="selected === cat"
        [class.text-white]="selected === cat"
        [class.shadow-sm]="selected === cat"
        [class.text-gray-600]="selected !== cat"
        [class.dark:text-gray-400]="selected !== cat"
        [class.bg-gray-100]="selected !== cat"
        [class.dark:bg-gray-800]="selected !== cat"
        [class.hover:bg-gray-200]="selected !== cat"
        [class.dark:hover:bg-gray-700]="selected !== cat"
      >
        {{ cat }}
      </button>
    }
    @if (selected) {
      <button 
        (click)="select(undefined)" 
        type="button"
        class="ml-auto inline-flex items-center gap-1 text-sm font-medium text-gray-500 dark:text-gray-400 hover:text-gray-700 dark:hover:text-gray-200 transition-colors"
      >
        <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
        </svg>
        Clear filters
      </button>
    }
  </div>
</div>
