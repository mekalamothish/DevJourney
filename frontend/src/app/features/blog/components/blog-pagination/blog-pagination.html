<nav class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8" aria-label="Pagination">
  <ul class="mt-6 flex items-center justify-center gap-1.5">
    <li>
      <button 
        (click)="go(current-1)" 
        [disabled]="current===1" 
        type="button"
        class="inline-flex items-center gap-1 h-9 px-3 rounded-lg text-sm font-medium text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-800 disabled:opacity-40 disabled:pointer-events-none transition-colors"
      >
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18" />
        </svg>
        <span class="hidden sm:inline">Previous</span>
      </button>
    </li>

    @for (p of pages; track p) {
      <li>
          <button
            (click)="go(p)"
            [attr.aria-current]="p===current ? 'page' : null"
            type="button"
            class="inline-flex h-9 min-w-[2.25rem] items-center justify-center rounded-lg px-2 text-sm font-medium transition-colors"
            [class.bg-blue-600]="p===current"
            [class.text-white]="p===current"
            [class.shadow-sm]="p===current"
            [class.text-gray-600]="p!==current"
            [class.dark:text-gray-300]="p!==current"
            [class.hover:bg-gray-100]="p!==current"
            [class.dark:hover:bg-gray-800]="p!==current"
          >
            {{ p }}
          </button>
      </li>
    }

    <li>
      <button 
        (click)="go(current+1)" 
        [disabled]="current===total" 
        type="button"
        class="inline-flex items-center gap-1 h-9 px-3 rounded-lg text-sm font-medium text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-800 disabled:opacity-40 disabled:pointer-events-none transition-colors"
      >
        <span class="hidden sm:inline">Next</span>
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5L21 12m0 0l-7.5 7.5M21 12H3" />
        </svg>
      </button>
    </li>
  </ul>
</nav>
