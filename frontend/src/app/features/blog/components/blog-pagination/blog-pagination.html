<nav class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8" aria-label="Pagination">
  <ul class="mt-6 flex items-center justify-center gap-2">
    <li>
      <button (click)="go(current-1)" [disabled]="current===1" class="btn-secondary" type="button">← Previous</button>
    </li>

    @for (p of pages; track p) {
      <li>
        <button
          (click)="go(p)"
          [attr.aria-current]="p===current ? 'page' : null"
          class="inline-flex h-9 min-w-[2.25rem] items-center justify-center rounded-md px-2 text-sm font-medium"
          [class.font-semibold]="p===current"
        >
          {{ p }}
        </button>
      </li>
    }

    <li>
      <button (click)="go(current+1)" [disabled]="current===total" class="btn-secondary" type="button">Next →</button>
    </li>
  </ul>
</nav>
