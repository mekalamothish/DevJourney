<div class="space-y-5">
  <div class="flex items-center justify-between">
    <h3 class="text-sm font-semibold text-gray-900 dark:text-white tracking-tight">Terminal Output</h3>
    <button 
      (click)="clearLines()" 
      type="button"
      class="inline-flex items-center gap-1 text-xs font-medium px-2.5 py-1.5 text-red-600 dark:text-red-400 hover:bg-red-50 dark:hover:bg-red-900/30 rounded-md transition-colors"
    >
      Clear
    </button>
  </div>

  <!-- Terminal Preview -->
  <div class="rounded-xl bg-gray-900 dark:bg-black border border-gray-700/50 dark:border-gray-800 shadow-lg overflow-hidden">
    <!-- Title bar -->
    <div class="flex items-center gap-1.5 px-4 py-2.5 bg-gray-800/80 dark:bg-gray-900/80 border-b border-gray-700/50 dark:border-gray-800">
      <span class="w-2.5 h-2.5 rounded-full bg-red-500/80"></span>
      <span class="w-2.5 h-2.5 rounded-full bg-yellow-500/80"></span>
      <span class="w-2.5 h-2.5 rounded-full bg-green-500/80"></span>
      <span class="ml-2 text-[11px] text-gray-400 font-mono">bash</span>
    </div>
    <!-- Output -->
    <div class="p-4 font-mono text-xs overflow-x-auto">
      <div class="space-y-1.5">
        @for (line of lines; track $index) {
          @if (line) {
            <div class="flex gap-2">
              <span class="text-blue-400 select-none">$</span>
              <span class="text-gray-100">{{ line }}</span>
            </div>
          }
        }
        @if (!lines.filter(l => l).length) {
          <div class="text-gray-500 italic">No commands yet — add one below</div>
        }
      </div>
    </div>
  </div>

  <!-- Line Editor -->
  <div class="space-y-1.5">
    @for (line of lines; track $index) {
      <div class="group flex items-center gap-2">
        <span class="text-[11px] font-mono text-gray-400 dark:text-gray-600 w-5 text-right tabular-nums">{{ $index + 1 }}</span>
        <div class="relative flex-1">
          <span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 dark:text-gray-500 font-mono text-sm pointer-events-none">$</span>
          <input 
            [value]="line"
            (change)="updateLine($index, $event.target.value)"
            type="text"
            placeholder="Enter terminal command..."
            class="w-full pl-7 pr-3 py-2 bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-lg font-mono text-sm text-gray-900 dark:text-white placeholder-gray-400 dark:placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500 transition-shadow"
          />
        </div>
        <div class="flex gap-0.5 opacity-0 group-hover:opacity-100 transition-opacity">
          <button 
            (click)="addLine($index)" 
            type="button"
            class="inline-flex items-center justify-center w-7 h-7 rounded-md text-gray-400 hover:text-blue-600 hover:bg-blue-50 dark:hover:bg-blue-900/30 dark:hover:text-blue-400 transition-colors"
            title="Insert line after"
          >
            <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
            </svg>
          </button>
          <button 
            (click)="removeLine($index)" 
            [disabled]="lines.length <= 1"
            type="button"
            class="inline-flex items-center justify-center w-7 h-7 rounded-md text-gray-400 hover:text-red-600 hover:bg-red-50 dark:hover:bg-red-900/30 dark:hover:text-red-400 disabled:opacity-30 disabled:cursor-not-allowed disabled:hover:bg-transparent transition-colors"
            title="Remove line"
          >
            <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
            </svg>
          </button>
        </div>
      </div>
    }
  </div>

  <!-- Add Line + Count -->
  <div class="flex items-center justify-between flex-wrap gap-2">
    <button 
      (click)="addLine()" 
      type="button"
      class="inline-flex items-center gap-1.5 px-3 py-1.5 text-xs font-medium rounded-lg bg-blue-50 dark:bg-blue-900/30 text-blue-700 dark:text-blue-300 hover:bg-blue-100 dark:hover:bg-blue-900/50 active:scale-95 transition-all"
    >
      <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
      </svg>
      Add Line
    </button>

    <p class="text-xs text-gray-400 dark:text-gray-500 font-medium">
      {{ lines.filter(l => l).length }} command(s)
    </p>
  </div>
</div>
