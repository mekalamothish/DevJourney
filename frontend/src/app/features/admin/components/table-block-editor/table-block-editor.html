<div class="space-y-5">
  <div class="flex items-center justify-between">
    <h3 class="text-sm font-semibold text-gray-900 dark:text-white tracking-tight">Table Editor</h3>
    <button 
      (click)="clearTable()" 
      type="button"
      class="inline-flex items-center gap-1 text-xs font-medium px-2.5 py-1.5 text-red-600 dark:text-red-400 hover:bg-red-50 dark:hover:bg-red-900/30 rounded-md transition-colors"
    >
      Clear
    </button>
  </div>

  <!-- Table Preview/Editor -->
  <div class="overflow-x-auto rounded-xl border border-gray-200 dark:border-gray-700 shadow-sm bg-white dark:bg-gray-900">
    <table class="w-full text-sm border-collapse">
      <thead>
        <tr class="bg-gray-50 dark:bg-gray-800/60 border-b border-gray-200 dark:border-gray-700">
          @for (header of headers; track $index) {
            <th class="px-3 py-2.5 text-left">
              <input 
                [value]="header"
                (change)="updateHeader($index, $event.target.value)"
                type="text"
                placeholder="Header"
                class="w-full px-2.5 py-1.5 bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-600 rounded-md text-xs font-medium text-gray-700 dark:text-gray-200 focus:outline-none focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500 transition-shadow"
              />
            </th>
            <th class="w-10 px-1 py-2.5 text-center">
              <button 
                (click)="removeColumn($index)" 
                [disabled]="headers.length <= 1"
                type="button"
                class="inline-flex items-center justify-center w-6 h-6 rounded-md text-gray-400 hover:text-red-600 hover:bg-red-50 dark:hover:bg-red-900/30 dark:hover:text-red-400 disabled:opacity-30 disabled:cursor-not-allowed disabled:hover:bg-transparent transition-colors"
              >
                <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                </svg>
              </button>
            </th>
          }
        </tr>
      </thead>
      <tbody>
        @for (row of rows; track $index; let rowIdx = $index) {
          <tr class="border-b border-gray-100 dark:border-gray-800 last:border-b-0 hover:bg-gray-50/50 dark:hover:bg-gray-800/30 transition-colors">
            @for (cell of row; track $index; let colIdx = $index) {
              <td class="px-3 py-2">
                <input 
                  [value]="cell"
                  (change)="updateCell(rowIdx, colIdx, $event.target.value)"
                  type="text"
                  placeholder="—"
                  class="w-full px-2.5 py-1.5 bg-transparent border border-transparent hover:border-gray-200 dark:hover:border-gray-700 rounded-md text-xs text-gray-700 dark:text-gray-200 focus:outline-none focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500 focus:bg-white dark:focus:bg-gray-900 transition-all"
                />
              </td>
            }
            <td class="w-10 px-1 py-2 text-center">
              <button 
                (click)="removeRow(rowIdx)" 
                [disabled]="rows.length <= 1"
                type="button"
                class="inline-flex items-center justify-center w-6 h-6 rounded-md text-gray-400 hover:text-red-600 hover:bg-red-50 dark:hover:bg-red-900/30 dark:hover:text-red-400 disabled:opacity-30 disabled:cursor-not-allowed disabled:hover:bg-transparent transition-colors"
              >
                <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                </svg>
              </button>
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>

  <!-- Controls -->
  <div class="flex items-center justify-between flex-wrap gap-2">
    <div class="flex gap-2">
      <button 
        (click)="addRow()" 
        type="button"
        class="inline-flex items-center gap-1.5 px-3 py-1.5 text-xs font-medium rounded-lg bg-blue-50 dark:bg-blue-900/30 text-blue-700 dark:text-blue-300 hover:bg-blue-100 dark:hover:bg-blue-900/50 active:scale-95 transition-all"
      >
        <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
        </svg>
        Add Row
      </button>
      <button 
        (click)="addColumn()" 
        type="button"
        class="inline-flex items-center gap-1.5 px-3 py-1.5 text-xs font-medium rounded-lg bg-blue-50 dark:bg-blue-900/30 text-blue-700 dark:text-blue-300 hover:bg-blue-100 dark:hover:bg-blue-900/50 active:scale-95 transition-all"
      >
        <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
        </svg>
        Add Column
      </button>
    </div>

    <p class="text-xs text-gray-400 dark:text-gray-500 font-medium">
      {{ rows.length }} rows · {{ headers.length }} cols
    </p>
  </div>
</div>
