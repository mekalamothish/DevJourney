<section class="mx-auto max-w-7xl px-4 py-8 sm:px-6 lg:px-8">
  <div class="mx-auto max-w-3xl">
    <h2 class="font-display text-2xl font-semibold text-ink">Popular Articles</h2>
    <ol class="mt-4 space-y-4">
      @for (post of posts(); track post.id; let i = $index) {
        <li class="flex items-start gap-4">
          <div class="font-mono text-sm font-semibold text-ink/50 w-8">{{ (i + 1) < 10 ? ('0' + (i + 1)) : (i + 1) }}</div>
          <div>
            <a [routerLink]="['/blog', post.slug]" class="font-display text-sm font-semibold leading-tight text-ink hover:underline">{{ post.title }}</a>
            <div class="mt-1 text-xs text-ink/60">{{ post.category.name }} · {{ post.readingTime }} min</div>
          </div>
        </li>
      }
    </ol>
  </div>
</section>
