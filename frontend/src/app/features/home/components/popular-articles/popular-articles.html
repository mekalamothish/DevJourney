<section class="mx-auto max-w-7xl px-4 py-8 sm:px-6 lg:px-8">
  <div class="mx-auto max-w-3xl">
    <div class="flex items-center gap-2">
      <svg class="w-5 h-5 text-orange-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M15.362 5.214A8.252 8.252 0 0112 21 8.25 8.25 0 016.038 7.048 8.287 8.287 0 009 9.6a8.983 8.983 0 013.361-6.867 8.21 8.21 0 003 2.48z" />
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 18a3.75 3.75 0 00.495-7.467 5.99 5.99 0 00-1.925 3.546 5.974 5.974 0 01-2.133-1A3.75 3.75 0 0012 18z" />
      </svg>
      <h2 class="font-display text-2xl font-bold tracking-tight text-gray-900 dark:text-white">Popular Articles</h2>
    </div>

    <ol class="mt-6 divide-y divide-gray-100 dark:divide-gray-800">
      @for (post of posts(); track post.id; let i = $index) {
        <li>
          <a 
            [routerLink]="['/blog', post.slug]" 
            class="group flex items-start gap-4 py-4 first:pt-0 hover:bg-gray-50 dark:hover:bg-gray-800/30 -mx-3 px-3 rounded-lg transition-colors"
          >
            <div class="font-mono text-sm font-bold w-8 shrink-0" [class]="i < 3 ? 'text-blue-600 dark:text-blue-400' : 'text-gray-300 dark:text-gray-700'">
              {{ (i + 1) < 10 ? ('0' + (i + 1)) : (i + 1) }}
            </div>
            <div class="min-w-0">
              <div class="font-display text-sm font-semibold leading-snug text-gray-900 dark:text-white group-hover:text-blue-600 dark:group-hover:text-blue-400 transition-colors">
                {{ post.title }}
              </div>
              <div class="mt-1.5 flex items-center gap-1.5 text-xs text-gray-500 dark:text-gray-400">
                <span>{{ post.category.name }}</span>
                <span>·</span>
                <span>{{ post.readingTime }} min</span>
              </div>
            </div>
          </a>
        </li>
      }
    </ol>
  </div>
</section>
