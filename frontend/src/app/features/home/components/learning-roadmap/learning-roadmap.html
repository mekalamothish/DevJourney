<section class="mx-auto max-w-7xl px-4 py-8 sm:px-6 lg:px-8">
  <div class="mx-auto max-w-3xl">
    <h2 class="font-display text-2xl font-semibold text-ink">Learning Roadmap</h2>
    <div class="mt-6">
      <ul class="ml-3 border-l border-border pl-6 space-y-6">
        @for (item of items; track item) {
          <li class="flex items-start gap-3">
            <span class="-ml-6 mt-1 inline-block h-3 w-3 flex-shrink-0 rounded-full bg-accent ring-2 ring-surface"></span>
            <div>
              <div class="font-display text-sm font-semibold text-ink">{{ item }}</div>
            </div>
          </li>
        }
      </ul>
    </div>
  </div>
</section>
