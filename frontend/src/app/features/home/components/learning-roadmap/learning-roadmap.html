<section class="mx-auto max-w-7xl px-4 py-10 sm:px-6 lg:px-8">
  <div class="mx-auto max-w-3xl">
    <div class="flex items-center gap-2">
      <svg class="w-5 h-5 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M11.35 3.836c-.065.21-.1.433-.1.664 0 .414.336.75.75.75h4.5a.75.75 0 00.75-.75 2.25 2.25 0 00-.1-.664m-5.8 0A2.251 2.251 0 0113.5 2.25H15c1.012 0 1.867.668 2.15 1.586m-5.8 0c-.376.023-.75.05-1.124.08C9.095 4.01 8.25 4.973 8.25 6.108V8.25m8.9-4.414c.376.023.75.05 1.124.08 1.131.094 1.976 1.057 1.976 2.192V16.5A2.25 2.25 0 0118 18.75h-2.25m-7.5-10.5H4.875c-.621 0-1.125.504-1.125 1.125v11.25c0 .621.504 1.125 1.125 1.125h9.75c.621 0 1.125-.504 1.125-1.125V18.75m-7.5-10.5h6.375c.621 0 1.125.504 1.125 1.125v9.375" />
      </svg>
      <h2 class="font-display text-2xl font-bold tracking-tight text-gray-900 dark:text-white">Learning Roadmap</h2>
    </div>

    <div class="mt-8">
      <ul class="relative ml-3 border-l-2 border-gray-200 dark:border-gray-800 pl-8 space-y-8">
        @for (item of items; track item; let i = $index; let last = $last) {
          <li class="relative">
            <span class="absolute -left-[2.55rem] top-0.5 flex items-center justify-center h-6 w-6 rounded-full bg-blue-600 text-white text-[11px] font-semibold ring-4 ring-white dark:ring-gray-950 shadow-sm">
              {{ i + 1 }}
            </span>
            <div class="font-display text-sm font-semibold text-gray-900 dark:text-white leading-relaxed">
              {{ item }}
            </div>
          </li>
        }
      </ul>
    </div>
  </div>
</section>
