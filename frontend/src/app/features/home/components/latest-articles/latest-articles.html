<section class="mx-auto max-w-7xl px-4 py-8 sm:px-6 lg:px-8">
  <div class="mx-auto">
    <h2 class="font-display text-2xl font-semibold text-ink">Latest Articles</h2>
    <div class="mt-6 grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-2 xl:grid-cols-3">
      @for (post of posts(); track post.id) {
        <dj-blog-card [post]="post" />
      }
    </div>
  </div>
</section>
