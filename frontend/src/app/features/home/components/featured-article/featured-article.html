<section class="mx-auto max-w-7xl px-4 py-10 sm:px-6 lg:px-8">
  <div class="mx-auto max-w-6xl">
    <div class="flex items-center gap-2">
      <svg class="w-5 h-5 text-amber-500" fill="currentColor" viewBox="0 0 24 24">
        <path fill-rule="evenodd" d="M10.788 3.21c.448-1.077 1.976-1.077 2.424 0l2.082 5.007 5.404.433c1.164.093 1.636 1.545.749 2.305l-4.117 3.527 1.257 5.273c.271 1.136-.964 2.033-1.96 1.425L12 18.354 7.373 21.18c-.996.608-2.231-.29-1.96-1.425l1.257-5.273-4.117-3.527c-.887-.76-.415-2.212.749-2.305l5.404-.433 2.082-5.007z" clip-rule="evenodd" />
      </svg>
      <h2 class="font-display text-2xl font-bold tracking-tight text-gray-900 dark:text-white">Featured Article</h2>
    </div>

    <div class="mt-6">
      @if (post()) {
        <article class="group rounded-2xl border border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-900 shadow-sm hover:shadow-md transition-shadow grid grid-cols-1 gap-0 overflow-hidden md:grid-cols-2">
          <div class="relative bg-gray-100 dark:bg-gray-800 flex items-center justify-center overflow-hidden">
            @if (post()!.featuredImage) {
              <img 
                [src]="post()!.featuredImage" 
                [alt]="post()!.title" 
                class="h-56 w-full object-cover md:h-full transition-transform duration-300 group-hover:scale-105" 
              />
            } @else {
              <div class="flex h-56 w-full items-center justify-center md:h-full bg-gradient-to-br from-gray-50 to-gray-100 dark:from-gray-800 dark:to-gray-900">
                <span class="font-mono text-5xl text-gray-300 dark:text-gray-700">&lt;/&gt;</span>
              </div>
            }
          </div>

          <div class="p-6 md:p-8 flex flex-col justify-center">
            <div class="flex items-center gap-2 flex-wrap">
              <span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-medium bg-blue-50 dark:bg-blue-900/30 text-blue-700 dark:text-blue-300">
                {{ post()!.category.name }}
              </span>
              <span class="inline-flex items-center gap-1 text-xs text-gray-400 dark:text-gray-500">
                <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
                {{ post()!.readingTime }} min
              </span>
            </div>

            <h3 class="mt-3 text-2xl font-display font-bold tracking-tight text-gray-900 dark:text-white leading-tight group-hover:text-blue-600 dark:group-hover:text-blue-400 transition-colors">
              {{ post()!.title }}
            </h3>
            <p class="mt-3 text-sm text-gray-600 dark:text-gray-300 leading-relaxed line-clamp-3">{{ post()!.excerpt }}</p>

            <div class="mt-4 flex items-center gap-2 text-xs text-gray-500 dark:text-gray-400">
              <span class="font-mono font-medium text-gray-700 dark:text-gray-300">{{ post()!.author.name }}</span>
              <span>•</span>
              <time>{{ post()!.publishedAt }}</time>
            </div>

            <div class="mt-6">
              <a 
                [routerLink]="['/blog', post()!.slug]" 
                class="inline-flex items-center gap-1.5 px-4 py-2 text-sm font-medium rounded-lg bg-blue-600 text-white hover:bg-blue-700 active:scale-95 transition-all shadow-sm"
              >
                Read Article
                <svg class="w-3.5 h-3.5 transition-transform group-hover:translate-x-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5L21 12m0 0l-7.5 7.5M21 12H3" />
                </svg>
              </a>
            </div>
          </div>
        </article>
      } @else {
        <div class="rounded-xl border border-dashed border-gray-300 dark:border-gray-700 p-10 text-center">
          <p class="text-sm text-gray-500 dark:text-gray-400">No featured article available.</p>
        </div>
      }
    </div>
  </div>
</section>
