<article class="h-full card overflow-hidden">
  <div class=" h-full flex flex-col sm:flex-row">
    <div class="h-40 w-full bg-surface/60 sm:h-auto sm:w-44 flex-shrink-0 flex items-center justify-center border-r border-border">
      @if (post.featuredImage) {
        <img src="{{ post.featuredImage }}" alt="{{ post.title }}" class="h-full w-full object-cover" />
      } @else {
        <div class="flex h-40 w-full items-center justify-center sm:h-auto sm:w-44">
          <span class="font-mono text-2xl text-ink/20">&lt;/&gt;</span>
        </div>
      }
    </div>
    <div class="p-4 sm:p-5">
      <div class="flex items-center gap-2">
        <span class="badge">{{ post.category.name }}</span>
        <span class="text-xs text-ink/50">• {{ post.readingTime }} min</span>
      </div>
      <h3 class="mt-2 text-lg font-display font-semibold text-ink">
        <a [routerLink]="['/blog', post.slug]" class="hover:underline">{{ post.title }}</a>
      </h3>
      <p class="mt-2 text-sm text-ink/70">{{ post.excerpt }}</p>
      <div class="mt-3 flex items-center gap-3 text-xs text-ink/60">
        <span class="font-mono">{{ post.author.name }}</span>
        <span>•</span>
        <time>{{ post.publishedAt }}</time>
      </div>
    </div>
  </div>
</article>
