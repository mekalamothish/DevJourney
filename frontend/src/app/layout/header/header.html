<header class="sticky top-0 z-40 border-b border-border bg-canvas/90 backdrop-blur">
  <div class="mx-auto flex h-16 max-w-7xl items-center justify-between px-4 sm:px-6 lg:px-8">
    <a
      routerLink="/"
      (click)="closeMenu()"
      class="focus-visible:outline-accent flex items-center gap-2.5 rounded-md focus-visible:outline-2 focus-visible:outline-offset-4"
    >
      <span
        class="flex h-8 w-8 items-center justify-center rounded-md bg-ink font-mono text-sm font-semibold text-accent"
        aria-hidden="true"
        >&lt;/&gt;</span
      >
      <span class="font-display text-lg font-semibold tracking-tight text-ink">{{
        site.name
      }}</span>
    </a>

    <nav class="hidden items-center gap-1 md:flex" aria-label="Primary">
      @for (link of site.primaryNav; track link.label) {
        <a
          [routerLink]="link.path"
          [fragment]="link.fragment"
          routerLinkActive="text-ink after:scale-x-100"
          [routerLinkActiveOptions]="{ exact: link.path === '/' && !link.fragment }"
          class="after:bg-accent relative px-3 py-2 text-sm font-medium text-ink/70 transition-colors after:absolute after:inset-x-3 after:-bottom-px after:h-0.5 after:scale-x-0 after:transition-transform after:content-[''] hover:text-ink"
        >
          {{ link.label }}
        </a>
      }
    </nav>

    <div class="flex items-center gap-2">
      <a [routerLink]="site.headerCta.path" class="btn-accent hidden md:inline-flex">{{
        site.headerCta.label
      }}</a>

      <button
        type="button"
        class="text-ink focus-visible:outline-accent inline-flex h-10 w-10 items-center justify-center rounded-md focus-visible:outline-2 focus-visible:outline-offset-2 md:hidden"
        [attr.aria-expanded]="isMenuOpen()"
        aria-controls="mobile-nav"
        [attr.aria-label]="isMenuOpen() ? 'Close menu' : 'Open menu'"
        (click)="toggleMenu()"
      >
        @if (isMenuOpen()) {
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            class="h-5 w-5"
            aria-hidden="true"
          >
            <line x1="6" y1="6" x2="18" y2="18" />
            <line x1="6" y1="18" x2="18" y2="6" />
          </svg>
        } @else {
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            class="h-5 w-5"
            aria-hidden="true"
          >
            <line x1="4" y1="7" x2="20" y2="7" />
            <line x1="4" y1="12" x2="20" y2="12" />
            <line x1="4" y1="17" x2="20" y2="17" />
          </svg>
        }
      </button>
    </div>
  </div>

  @if (isMenuOpen()) {
    <nav id="mobile-nav" class="border-t border-border bg-canvas md:hidden" aria-label="Mobile">
      <div class="flex flex-col gap-1 px-4 py-3 sm:px-6">
        @for (link of site.primaryNav; track link.label) {
          <a
            [routerLink]="link.path"
            [fragment]="link.fragment"
            routerLinkActive="bg-surface text-ink"
            [routerLinkActiveOptions]="{ exact: link.path === '/' && !link.fragment }"
            (click)="closeMenu()"
            class="rounded-md px-3 py-2 text-sm font-medium text-ink/70 hover:bg-surface hover:text-ink"
          >
            {{ link.label }}
          </a>
        }
        <a
          [routerLink]="site.headerCta.path"
          (click)="closeMenu()"
          class="btn-accent mt-2 justify-center"
        >
          {{ site.headerCta.label }}
        </a>
      </div>
    </nav>
  }
</header>
