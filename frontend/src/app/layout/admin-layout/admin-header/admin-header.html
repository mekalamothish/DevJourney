<header class="sticky top-0 z-40 border-b border-border bg-surface">
  <div class="mx-auto flex h-14 max-w-7xl items-center justify-between gap-4 px-4 sm:px-6 lg:px-8">
    <div class="flex items-center gap-3">
      <button
        type="button"
        class="md:hidden text-ink inline-flex h-10 w-10 items-center justify-center rounded-md focus-visible:outline-accent focus-visible:outline-2 focus-visible:outline-offset-2"
        (click)="onToggle?.()"
        aria-label="Toggle sidebar"
      >
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" class="h-5 w-5" aria-hidden="true">
          <line x1="4" y1="7" x2="20" y2="7" />
          <line x1="4" y1="12" x2="20" y2="12" />
          <line x1="4" y1="17" x2="20" y2="17" />
        </svg>
      </button>

      <a routerLink="/admin" class="flex items-center gap-2.5">
        <span class="flex h-8 w-8 items-center justify-center rounded-md bg-accent font-mono text-sm font-semibold text-ink" aria-hidden="true">&lt;/&gt;</span>
        <span class="font-display text-base font-semibold tracking-tight text-ink">Admin</span>
      </a>
    </div>

    <div class="flex items-center gap-3">
      <a routerLink="/" class="text-sm text-ink/70 hover:text-ink">View site</a>
    </div>
  </div>
</header>
