<header class="sticky top-0 z-40 border-b border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-900 transition-colors duration-300">
  <div class="mx-auto flex h-14 max-w-7xl items-center justify-between gap-4 px-4 sm:px-6 lg:px-8">
    <div class="flex items-center gap-3">
      <button
        type="button"
        class="md:hidden text-gray-900 dark:text-white inline-flex h-10 w-10 items-center justify-center rounded-md hover:bg-gray-100 dark:hover:bg-gray-800 focus-visible:outline-blue-500 dark:focus-visible:outline-blue-400 focus-visible:outline-2 focus-visible:outline-offset-2 transition-colors"
        (click)="onToggle?.()"
        aria-label="Toggle sidebar"
      >
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" class="h-5 w-5" aria-hidden="true">
          <line x1="4" y1="7" x2="20" y2="7" />
          <line x1="4" y1="12" x2="20" y2="12" />
          <line x1="4" y1="17" x2="20" y2="17" />
        </svg>
      </button>

      <a routerLink="/admin" class="flex items-center gap-2.5">
        <span class="flex h-8 w-8 items-center justify-center rounded-md bg-blue-600 font-mono text-sm font-semibold text-white" aria-hidden="true">&lt;/&gt;</span>
        <span class="font-display text-base font-semibold tracking-tight text-gray-900 dark:text-white">Admin</span>
      </a>
    </div>

    <div class="flex items-center gap-4">
      <!-- Theme Toggle -->
      <dj-theme-toggle />

      <a routerLink="/" class="text-sm text-gray-600 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white transition-colors">View site</a>
    </div>
  </div>
</header>
